# Incluir una sola vez desde el archivo SSL activo de LAMPP.
# Mantener el prefijo al reenviar; estas opciones solo aplican a esta API.
<Location "/apiFeminicidios/">
    SSLRequireSSL
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-For "expr=%{CONN_REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "http://127.0.0.1:5003/apiFeminicidios/" connectiontimeout=5 timeout=180
    ProxyPassReverse "http://127.0.0.1:5003/apiFeminicidios/"
</Location>
